# Node.js
 
trigger:
- main
 
pool:
  vmImage: ubuntu-latest
 
steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'
 
# Authenticate npm with AWS CodeArtifact
- script: |
    echo "Authenticating with AWS CodeArtifact..."
 
    aws codeartifact login \
      --tool npm \
      --repository abdoun-library \
      --domain abdoun \
      --domain-owner $(AWS_ACCOUNT_ID) \
      --region us-west-2
 
    npm config set @abdoun:registry https://abdoun-$(AWS_ACCOUNT_ID).d.codeartifact.us-west-2.amazonaws.com/npm/abdoun-library/
    npm config set registry https://registry.npmjs.org/
 
  displayName: 'Authenticate npm with AWS CodeArtifact'
 
- script: |
    echo "Installing dependencies..."
    npm ci --cache .npm --prefer-offline
 
    echo "Building application..."
    npm run build
  displayName: 'npm install and build'